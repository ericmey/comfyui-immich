name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Gate the release on the full suite. Without this the release job raced CI
  # on the same commit and would happily tag a red build.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.new }}
    # This reads the HEAD commit of the push, which for a PR merge is the merge
    # or squash subject, not the branch commits. A default merge commit reads
    # "Merge pull request #N from ..." and matches no conventional prefix, so it
    # is skipped deliberately: squash with an explicit subject to release.
    if: >-
      !startsWith(github.event.head_commit.message, 'chore:') &&
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      !startsWith(github.event.head_commit.message, 'ci:') &&
      !startsWith(github.event.head_commit.message, 'docs:') &&
      !startsWith(github.event.head_commit.message, 'test:') &&
      !startsWith(github.event.head_commit.message, 'Merge pull request') &&
      !startsWith(github.event.head_commit.message, 'Merge branch')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Determine bump type
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -n1)
          if echo "$FIRST_LINE" | grep -qE '^feat!:|BREAKING CHANGE'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$FIRST_LINE" | grep -qE '^feat(\(.*\))?:'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$FIRST_LINE" | grep -qE '^fix(\(.*\))?:'; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        id: version
        run: |
          CURRENT=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          IFS='.' read -r major minor patch <<< "$CURRENT"

          BUMP="${{ steps.bump.outputs.type }}"
          if [ "$BUMP" = "major" ]; then
            major=$((major + 1)); minor=0; patch=0
          elif [ "$BUMP" = "minor" ]; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          NEW="$major.$minor.$patch"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEW ($BUMP)"

      - name: Update pyproject.toml
        run: |
          sed -i "s/^version = \"${{ steps.version.outputs.current }}\"/version = \"${{ steps.version.outputs.new }}\"/" pyproject.toml
          grep -q "^version = \"${{ steps.version.outputs.new }}\"" pyproject.toml

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore(release): v${{ steps.version.outputs.new }}"
          git tag "v${{ steps.version.outputs.new }}"
          git push origin main "v${{ steps.version.outputs.new }}"

      # Third-party action, and this job holds contents: write. Pinned to a
      # commit so a compromised or retagged v3 cannot reach that token. Bump
      # deliberately: the trailing comment is the human-readable version.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: "v${{ steps.version.outputs.new }}"
          name: "v${{ steps.version.outputs.new }}"
          generate_release_notes: true

  # Publish the release to the Comfy Registry, which is what ComfyUI Manager
  # lists. A separate, read-only job: it checks out the new tag (so the bumped
  # version is the one published) and never holds the contents: write token.
  #
  # We call comfy-cli directly, pinned to an exact version, instead of
  # Comfy-Org/publish-node-action: the action's pinned v1.0.1 ran
  # `comfy --yes env`, which current comfy-cli rejects, and it pip-installed
  # comfy-cli unpinned. Bump COMFY_CLI_VERSION deliberately and re-verify.
  registry:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COMFY_CLI_VERSION: "1.21.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.release.outputs.version }}"
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install comfy-cli
        run: python -m pip install "comfy-cli==${COMFY_CLI_VERSION}"

      - name: Publish to Comfy Registry
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: comfy --skip-prompt --no-enable-telemetry node publish --token "$REGISTRY_ACCESS_TOKEN"
