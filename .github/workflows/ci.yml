name: CI

on:
  pull_request:
    branches: [main]
  # Pushes to main reach this workflow through release.yml, which calls it as a
  # gate before cutting a release. Triggering on push here too would run every
  # check twice for the same commit.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The dev extra is the single source of truth for tool versions; listing
      # them here again is a copy that silently drifts.
      - name: Install project and dev tools
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and dev tools
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
