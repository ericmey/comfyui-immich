[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-immich"
version = "0.6.0"
description = "ComfyUI custom nodes for Immich integration — upload, metadata, album management"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Operating System :: OS Independent"]
requires-python = ">=3.10"
authors = [
    {name = "Eric Mey"},
]
keywords = ["comfyui", "immich", "image-upload", "custom-node"]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/sourceblender/comfyui-immich"
Issues = "https://github.com/sourceblender/comfyui-immich/issues"
Repository = "https://github.com/sourceblender/comfyui-immich"
Documentation = "https://github.com/sourceblender/comfyui-immich#readme"
"Bug Tracker" = "https://github.com/sourceblender/comfyui-immich/issues"

[tool.comfy]
PublisherId = "sourceblender"
DisplayName = "Save to Immich"
Icon = "https://raw.githubusercontent.com/sourceblender/comfyui-immich/main/docs/images/icon.png"
Banner = "https://raw.githubusercontent.com/sourceblender/comfyui-immich/main/docs/images/banner.png"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
    # Provided by ComfyUI at runtime; here so the real HTTP route tests run in CI.
    "aiohttp>=3.9",
]

[tool.setuptools]
# ComfyUI loads this repo by importing the checkout directory itself, so the
# root __init__.py is the entrypoint and is deliberately not packaged. Naming
# the package explicitly keeps tests/ out of the wheel.
packages = ["immich_nodes"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N999"]  # ComfyUI requires hyphenated folder names

[tool.ruff.lint.per-file-ignores]
"immich_nodes/*" = ["N802"]  # ComfyUI requires uppercase method names (INPUT_TYPES, etc.)

[tool.mypy]
python_version = "3.10"
files = ["immich_nodes"]
# The checkout directory is named comfyui-immich and carries an __init__.py for
# ComfyUI, which is not a legal package name. Without this, mypy refuses to run.
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["PIL.*", "folder_paths", "server", "aiohttp", "aiohttp.*"]  # injected/provided by ComfyUI at runtime
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy.*"]
# numpy ships stubs using 3.12-only syntax, which mypy parses even under
# python_version 3.10. Skip them rather than weaken the version target.
follow_imports = "skip"
follow_imports_for_stubs = true  # follow_imports alone does not apply to .pyi
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
